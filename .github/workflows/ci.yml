name: Build and verify
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: dotnet restore src/Grimarr/Grimarr.csproj --locked-mode
      - run: dotnet run --project tests/Grimarr.Tests
      - run: npm ci --ignore-scripts && npm audit --audit-level=high && npm run build
        working-directory: frontend
      - run: mkdir -p src/Grimarr/wwwroot && cp -r frontend/dist/. src/Grimarr/wwwroot/
      - run: node tests/integration.mjs
      - run: node tests/manual-selection.mjs
      - run: node tests/recovery.mjs
      - run: node tests/quick-add.mjs
      - run: node tests/library-availability.mjs
      - run: node tests/security.mjs
      - run: npx playwright install chromium --with-deps
        working-directory: frontend
      - run: node tests/ui.mjs
      - run: python3 tests/config_backup_test.py
      - run: python3 tests/release_package_test.py
      - run: docker build -t grimarr:ci .
      - run: python3 tests/installation.py --image grimarr:ci
      - name: Package exact source and scanned runtime
        run: |
          mkdir -p artifacts
          git archive --format=tar.gz --output="$RUNNER_TEMP/grimarr-source.tar.gz" HEAD
          python3 scripts/release.py build --source-archive "$RUNNER_TEMP/grimarr-source.tar.gz" --revision "$(git rev-parse HEAD)" --output artifacts/release --cache-dir "$RUNNER_TEMP/grimarr-scanner-cache"
          python3 tests/release_smoke.py --directory artifacts/release
          IMAGE=$(python3 -c "import json; print(json.load(open('artifacts/release/release.json'))['image'])")
          python3 tests/installation.py --image "$IMAGE" --previous-image grimarr:ci --compose-file artifacts/release/compose.release.yml
      - uses: actions/upload-artifact@v7
        with:
          name: grimarr-linux-amd64-release
          path: artifacts/release/
          compression-level: 0
          retention-days: 14
