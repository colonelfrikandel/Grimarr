services:
  grimarr:
    build: .
    image: "${GRIMARR_IMAGE:-grimarr:local}"
    container_name: grimarr
    restart: unless-stopped
    user: "${PUID:-1000}:${PGID:-1000}"
    ports:
      - "${GRIMARR_BIND_IP:-127.0.0.1}:${GRIMARR_PORT:-8787}:8787"
    environment:
      GRIMARR_CONFIG: /config
    volumes:
      - type: bind
        source: "${GRIMARR_CONFIG_DIR:-./config}"
        target: /config
        bind:
          create_host_path: false
      # Mount the common parent once so downloads and library can use hardlinks.
      - type: bind
        source: "${GRIMARR_DATA_DIR:-/srv/media}"
        target: /data
        bind:
          create_host_path: false
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
